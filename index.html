<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hunter - Pronat e Harruara</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background: #0b1420; 
            color: #d4e6ff;
        }
        h1 { color: #00ff99; text-align: center; font-size: 2rem; border-bottom: 2px solid #1a3a5a; padding-bottom: 15px; }
        .search-box { 
            background: #0e1e30; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            margin-bottom: 25px;
            border: 1px solid #1a3a5a;
        }
        input, select, button { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 1px solid #1a3a5a; 
            border-radius: 6px; 
            box-sizing: border-box; 
            background: #091520;
            color: #fff;
            font-size: 16px;
        }
        input:focus, select:focus { border-color: #00ff99; outline: none; }
        button { background: #00ff99; color: #0b1420; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #00cc7a; }
        .results { 
            background: #0e1e30; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid #1a3a5a;
        }
        .property { 
            border-bottom: 1px solid #1e3e5a; 
            padding: 15px 0; 
        }
        .property:last-child { border-bottom: none; }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }
        .owner { background: rgba(0, 255, 153, 0.2); color: #00ff99; }
        .agency { background: rgba(79, 195, 255, 0.2); color: #4fc3ff; }
    </style>
</head>
<body>
    <h1>🕵️ HUNTER - PRONAT E HARRUARA</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Kërko sipas emrit, adresës ose ID-së...">
        <select id="typeFilter">
            <option value="all">Të gjitha kontaktet</option>
            <option value="Direkt nga Pronari">Direkt nga Pronari</option>
            <option value="Agjenci">Agjenci Imobiliare</option>
        </select>
        <button onclick="searchProperties()">🔍 Filtro Inteligjencën</button>
    </div>
    
    <div id="results" class="results" style="display: none;">
        <h3 style="color: #4fc3ff; margin-top: 0;">Rezultatet e Gjetura (Skanimi 7-Ditor):</h3>
        <div id="propertyList"></div>
    </div>

    <script>
        const properties = [
            { id: "PRN-KIKA2", emri: "Apartament 2+1", adresa: "Komuna e Parisit, Kika 2", burimi: "Direkt nga Pronari", vlera: "€160,000" },
            { id: "PRN-KASHAR", emri: "Zonë Industriale / Tokë", adresa: "Pranë TEDA Tiranë", burimi: "Agjenci", vlera: "€450,000" },
            { id: "PRN-VLORA", emri: "Objekt Shërbimi", adresa: "Radhimë, Vlorë", burimi: "Direkt nga Pronari", vlera: "€210,000" }
        ];

        function searchProperties() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('typeFilter').value;
            
            const results = properties.filter(p => {
                const matchesQuery = p.emri.toLowerCase().includes(query) || 
                                     p.adresa.toLowerCase().includes(query) ||
                                     p.id.toLowerCase().includes(query);
                const matchesFilter = filter === 'all' || p.burimi === filter;
                return matchesQuery && matchesFilter;
            });
            
            const list = document.getElementById('propertyList');
            list.innerHTML = '';
            
            if (results.length === 0) {
                list.innerHTML = '<p style="color: #ffaa00;">Asnjë pronë nuk përputhet me kriteret e kërkimit.</p>';
            } else {
                results.forEach(prop => {
                    const tagClass = prop.burimi === 'Direkt nga Pronari' ? 'owner' : 'agency';
                    const div = document.createElement('div');
                    div.className = 'property';
                    div.innerHTML = `
                        <strong style="font-size: 18px; color: #fff;">${prop.emri}</strong><br>
                        <span style="color: #8ab4d6;">📍 ${prop.adresa}</span><br>
                        <small style="color: #5f82a6;">ID: ${prop.id} | Vlera: <span style="color: #00ff99; font-weight:bold;">${prop.vlera}</span></small><br>
                        <span class="tag ${tagClass}">${prop.burimi}</span>
                    `;
                    list.appendChild(div);
                });
            }
            
            document.getElementById('results').style.display = 'block';
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProperties();
        });
    </script>
</body>
</html>v
